[package]
name = "krampsta-app"
description = "Krampsta — Native AI Coding Agent. The desktop executable."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "krampsta"
path = "src/main.rs"

[dependencies]
krampsta-agent.workspace = true
krampsta-mcp.workspace = true
krampsta-providers.workspace = true
krampsta-store.workspace = true
krampsta-tools.workspace = true
krampsta-ui.workspace = true
rune.workspace = true

[features]
default = []
# Headless agent tooling (--snap, --tree, --script, ...) in release builds.
# Debug builds always accept those flags.
tooling = ["rune/tooling"]

[lints]
workspace = true

[dev-dependencies]
krampsta-core.workspace = true
serde_json.workspace = true
tempfile = "3"
