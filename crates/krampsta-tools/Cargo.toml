[package]
name = "krampsta-tools"
description = "The tools Krampsta's agent calls on the project folder: reading, listing and searching files."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
krampsta-agent.workspace = true
krampsta-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# ripgrep's own crates: gitignore-aware (parallel) walking, and SIMD line search with binary detection.
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
# Commands run as a process tree that can be killed whole: a job object on Windows, a process
# group on Unix.
process-wrap = { version = "10", default-features = false, features = ["std", "job-object", "creation-flags", "process-group", "kill-on-drop"] }
# Where the permission rules and the command log live (the user's config folder).
dirs = "7"

tempfile = "3"

[lints]
workspace = true

# To build process-wrap's `CreationFlags` (CREATE_NO_WINDOW: no console flashes up behind the
# app); the same version process-wrap uses.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", default-features = false, features = ["Win32_System_Threading"] }
