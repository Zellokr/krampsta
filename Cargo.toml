[workspace]
resolver = "3"
members = [
    "crates/krampsta-app",
    "crates/krampsta-core",
    "crates/krampsta-agent",
    "crates/krampsta-mcp",
    "crates/krampsta-providers",
    "crates/krampsta-store",
    "crates/krampsta-tools",
    "crates/krampsta-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99.1"

[workspace.dependencies]
krampsta-core = { path = "crates/krampsta-core" }
krampsta-agent = { path = "crates/krampsta-agent" }
krampsta-mcp = { path = "crates/krampsta-mcp" }
krampsta-providers = { path = "crates/krampsta-providers" }
krampsta-store = { path = "crates/krampsta-store" }
krampsta-tools = { path = "crates/krampsta-tools" }
krampsta-ui = { path = "crates/krampsta-ui" }

# Rune and rune-kit are pinned to ONE commit of Rune's `dev` branch (never a floating branch).
# When bumping, change RUNE_REV everywhere in this file at once — including every entry in
# [patch.crates-io] below — and re-read Rune's root Cargo.toml at the new revision. See README.md.
rune = { git = "https://github.com/anomalyco/rune", rev = "c8424ac797a2a7097a3530607c9ecadef37deec6", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "c8424ac797a2a7097a3530607c9ecadef37deec6", features = ["markdown"] }
# OpenCode's design language (tokens, Inter + IBM Plex Mono, icons) — the theme Rugents uses.
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "c8424ac797a2a7097a3530607c9ecadef37deec6" }

thiserror = "2"
# HTTP for real providers: rustls (no system OpenSSL), HTTP/2, streamed bodies.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "stream", "system-proxy", "form"] }
# Account sessions (Copilot, ChatGPT) in the system keychain.
keyring = "4"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "time", "macros", "sync", "net"] }
tokio-util = { version = "0.7", default-features = false }

# Rune ships patched copies of these crates (see the comments in Rune's root Cargo.toml).
# Cargo does not inherit a dependency's [patch] table, so an app that builds Rune repeats it.
# Same revision as `rune` above.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "c8424ac797a2a7097a3530607c9ecadef37deec6" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "c8424ac797a2a7097a3530607c9ecadef37deec6" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "c8424ac797a2a7097a3530607c9ecadef37deec6" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "c8424ac797a2a7097a3530607c9ecadef37deec6" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "c8424ac797a2a7097a3530607c9ecadef37deec6" }
naga = { git = "https://github.com/anomalyco/rune", rev = "c8424ac797a2a7097a3530607c9ecadef37deec6" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "c8424ac797a2a7097a3530607c9ecadef37deec6" }
accesskit_atspi_common = { git = "https://github.com/anomalyco/rune", rev = "c8424ac797a2a7097a3530607c9ecadef37deec6" }

# Full debug info for Rune makes test builds enormous; line tables keep backtraces useful.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
# Dependencies (Rune, wgpu, text shaping, regex…) optimized even in dev builds: unoptimized, a
# frame costs ~20x the CPU (2.1 ms vs 0.1 ms p50 streaming a reply) and the window stutters.
# Krampsta's own crates stay at opt-level 0, so rebuilding them stays fast.
opt-level = 3

[profile.release]
codegen-units = 16

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
await_holding_lock = "deny"
dbg_macro = "deny"
expect_used = "warn"
unwrap_used = "warn"
todo = "warn"
